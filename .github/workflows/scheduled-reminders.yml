name: Scheduled Medication Reminders

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes (GitHub Action cron minimum for reliability)
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Medication Reminders
        run: |
          curl -X GET "${{ secrets.PROD_API_URL }}/api/v1/medication-reminders/run-cron" \
          -H "Accept: application/json"
